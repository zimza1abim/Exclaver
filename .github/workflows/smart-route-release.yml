name: Smart Route APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_COMPILE_SDK_PACKAGE: "platforms;android-37.0"
      ANDROID_BUILD_TOOLS: "37.0.0"
      ANDROID_NDK_VERSION: "29.0.13599879"
      GO_VERSION: "1.26.x"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: library/core/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --channel=3 "${ANDROID_COMPILE_SDK_PACKAGE}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_PATH"

      - name: Set up Go Mobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build libexclavecore
        working-directory: library/core
        run: |
          mkdir -p ../../app/libs
          bash ./build.sh

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Lint
        run: ./gradlew :app:lint

      - name: Build debug APK
        run: ./gradlew :app:assembleOssDebug

      - name: Build release APK
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.ANDROID_KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleOssRelease

      - name: Skip release APK
        if: ${{ env.HAS_SIGNING != 'true' }}
        run: echo "Signing secrets not present. Release APK skipped."

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-route-apks
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Exclaver ${{ inputs.tag }}
          files: app/build/outputs/apk/**/*.apk
