name: Smart Route APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.4
          cache-dependency-path: library/core/go.sum

      - name: Set up Go Mobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260611195102-4dd8f1dbf5d2
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260611195102-4dd8f1dbf5d2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build libexclavecore
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p app/libs
          ./run lib core

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Download assets
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew :app:downloadAssets

      - name: Lint
        continue-on-error: true
        run: ./gradlew :app:lint

      - name: Upload lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: smart-route-lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/intermediates/lint_intermediate_text_report/**/lint-results-*.txt
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew :app:assembleOssDebug

      - name: Build release APK
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.ANDROID_KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleOssRelease

      - name: Skip release APK
        if: ${{ env.HAS_SIGNING != 'true' }}
        run: echo "Signing secrets not present. Release APK skipped."

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-route-apks
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Exclaver ${{ inputs.tag }}
          files: app/build/outputs/apk/**/*.apk
